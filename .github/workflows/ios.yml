name: CarTripAssistant iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project CarTripAssistant.xcodeproj -scheme CarTripAssistant -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarTripAssistant.app Payload/
          zip -qry CarTripAssistant-V1.1.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CarTripAssistant-V1.1.0-unsigned-IPA
          path: CarTripAssistant-V1.1.0-unsigned.ipa

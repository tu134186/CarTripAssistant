name: CarTripAssistant iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Shenzhen Offline Map"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble uploaded app source
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq app.zip
          mkdir -p /tmp/cartrip-v224
          unzip -qo app.zip -d /tmp/cartrip-v224
          ROOT=/tmp/cartrip-v224
          if [ ! -f "$ROOT/project.yml" ]; then
            PROJECT="$(find "$ROOT" -name project.yml -type f | head -1)"
            ROOT="$(dirname "$PROJECT")"
          fi
          test -f "$ROOT/CarTripAssistant/App.swift"
          # Current repository is authoritative. Never overwrite new Baidu SDK
          # source, Info.plist or assets with the legacy app.zip snapshot.
          test -s CarTripAssistant/App.swift
          test -s CarTripAssistant/BaiduRouteMap.swift
          test -s CarTripAssistant/BaiduMapHostView.m
          test -s CarTripAssistant/Info.plist
          echo "Using version-controlled app source; legacy app.zip is validation-only"
          python3 - <<'PY'
          import plistlib
          p='CarTripAssistant/Info.plist'
          with open(p,'rb') as f: info=plistlib.load(f)
          assert info.get('CFBundleShortVersionString'), 'Uploaded source missing app version'
          info['CFBundleShortVersionString']='3.1.6'
          info['CFBundleVersion']='3106'
          with open(p,'wb') as f: plistlib.dump(info,f)
          PY
      - name: Publish optional Shenzhen map separately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            MAP_RUN="${{ github.event.workflow_run.id }}"
          else
            MAP_RUN=$(gh run list --repo "${{ github.repository }}" --workflow shenzhen-map.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -n "$MAP_RUN" ]; then
            echo "Optional Shenzhen map run: $MAP_RUN"
            if gh run download "$MAP_RUN" --repo "${{ github.repository }}" --name Shenzhen-Offline-Map-MBTiles --dir map-download && test -s map-download/Shenzhen-Roads.mbtiles; then
              if ! gh release view shenzhen-map-v1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
                gh release create shenzhen-map-v1 map-download/Shenzhen-Roads.mbtiles --repo "${{ github.repository }}" --title "Shenzhen Offline Map v1" --notes "Optional MBTiles download for CarTripAssistant V2.2.5+" || echo "Optional map release skipped"
              fi
            else
              echo "Optional Shenzhen map unavailable; continue IPA build"
            fi
          else
            echo "No optional Shenzhen map build; continue IPA build"
          fi
          test ! -f CarTripAssistant/OfflineMap.mbtiles
      - name: Generate app icon asset
        run: |
          python3 -m venv /tmp/cartrip-icon-venv
          /tmp/cartrip-icon-venv/bin/python -m pip install pillow
          if [ -d CarTripAssistant/Assets.xcassets/AppIcon.appiconset ] && find CarTripAssistant/Assets.xcassets/AppIcon.appiconset -iname '*.png' | grep -q .; then
            echo 'Using AppIcon assets from V2.2.4 source'
          else
            /tmp/cartrip-icon-venv/bin/python scripts/create_app_icon.py
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Install Baidu Map SDK
        run: |
          pod --version
          pod install --repo-update
      - name: Build unsigned IPA
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: |
          python3 - <<'PY'
          import os,plistlib
          p='CarTripAssistant/Info.plist'
          with open(p,'rb') as f: data=plistlib.load(f)
          key=os.environ.get('BAIDU_MAP_AK','')
          if key: data['BaiduMapAK']=key
          with open(p,'wb') as f: plistlib.dump(data,f)
          print('Baidu SDK AK configured:',bool(key))
          PY
          test -f CarTripAssistant.xcworkspace/contents.xcworkspacedata
          xcodebuild -workspace CarTripAssistant.xcworkspace -scheme CarTripAssistant -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarTripAssistant.app Payload/
          zip -qry CarTripAssistant-V3.1.6-unsigned.ipa Payload
          python3 - <<'PY'
          import plistlib
          p='CarTripAssistant/Info.plist'
          with open(p,'rb') as f: data=plistlib.load(f)
          data.pop('BaiduMapAK',None)
          with open(p,'wb') as f: plistlib.dump(data,f)
          PY
      - name: Verify IPA icon assets
        run: |
          python3 - <<'PY'
          import zipfile,plistlib
          ipa='CarTripAssistant-V3.1.6-unsigned.ipa'
          with zipfile.ZipFile(ipa) as z:
              names=z.namelist()
              info=plistlib.loads(z.read('Payload/CarTripAssistant.app/Info.plist'))
              assert info.get('CFBundleShortVersionString')=='3.1.6', info.get('CFBundleShortVersionString')
              assert 'Payload/CarTripAssistant.app/Assets.car' in names, 'Compiled asset catalog missing'
              icon=info.get('CFBundleIcons',{}).get('CFBundlePrimaryIcon',{})
              assert icon.get('CFBundleIconName')=='AppIcon' or icon.get('CFBundleIconFiles'), 'No primary icon metadata'
              print('Verified V3.1.6 and compiled AppIcon metadata')
          PY
      - name: Verify map excluded from IPA
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('CarTripAssistant-V3.1.6-unsigned.ipa') as z:
              assert not any(n.endswith('.mbtiles') for n in z.namelist()), 'Map unexpectedly bundled'
          print('Verified lightweight IPA without map tiles')
          PY
      - name: Package V3.1.6 source archive
        run: |
          zip -qry "V3.1.6-行程助手-源码.zip" CarTripAssistant scripts project.yml Podfile README.md
          unzip -t "V3.1.6-行程助手-源码.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: V3.1.6-行程助手-源码
          path: V3.1.6-行程助手-源码.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CarTripAssistant-V3.1.6-unsigned-IPA
          path: CarTripAssistant-V3.1.6-unsigned.ipa
          if-no-files-found: error

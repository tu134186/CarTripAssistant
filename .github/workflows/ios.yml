name: CarTripAssistant iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Shenzhen Offline Map"]
    types: [completed]
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle Shenzhen offline roads map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            MAP_RUN="${{ github.event.workflow_run.id }}"
          else
            MAP_RUN=$(gh run list --repo "${{ github.repository }}" --workflow shenzhen-map.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$MAP_RUN"
          echo "Using Shenzhen map build run $MAP_RUN"
          gh run download "$MAP_RUN" --repo "${{ github.repository }}" --name Shenzhen-Offline-Map-MBTiles --dir map-download
          test -s map-download/Shenzhen-Roads.mbtiles
          cp map-download/Shenzhen-Roads.mbtiles CarTripAssistant/OfflineMap.mbtiles
          ls -lh CarTripAssistant/OfflineMap.mbtiles
      - name: Generate app icon asset
        run: |
          python3 -m venv /tmp/cartrip-icon-venv
          /tmp/cartrip-icon-venv/bin/python -m pip install pillow
          /tmp/cartrip-icon-venv/bin/python scripts/create_app_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project CarTripAssistant.xcodeproj -scheme CarTripAssistant -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarTripAssistant.app Payload/
          zip -qry CarTripAssistant-V2.2.1-unsigned.ipa Payload
      - name: Verify embedded offline map in IPA
        run: |
          python3 - <<'PY'
          import io, sqlite3, tempfile, zipfile, os
          ipa = "CarTripAssistant-V2.2.1-unsigned.ipa"
          with zipfile.ZipFile(ipa) as z:
              candidates = [n for n in z.namelist() if n.endswith("/OfflineMap.mbtiles")]
              if len(candidates) != 1:
                  raise SystemExit("ERROR: OfflineMap.mbtiles not embedded in IPA")
              blob = z.read(candidates[0])
              if len(blob) < 1000000:
                  raise SystemExit("ERROR: offline map file unexpectedly small")
              with tempfile.NamedTemporaryFile(suffix=".mbtiles") as tmp:
                  tmp.write(blob); tmp.flush()
                  db = sqlite3.connect(tmp.name)
                  fmt = db.execute("SELECT value FROM metadata WHERE name='format'").fetchone()[0]
                  count, low, high = db.execute("SELECT COUNT(*), MIN(zoom_level), MAX(zoom_level) FROM tiles").fetchone()
                  assert fmt == "png" and count > 20000 and low <= 10 and high >= 16, (
                      f"Expected verified Shenzhen z16 map, got {count} tiles, z{low}-{high}")
                  print(f"Verified embedded Shenzhen offline map: {len(blob)} bytes, {count} tiles, zoom {low}-{high}")
          PY
      - name: Package V2.2.1 source archive
        run: |
          git archive --format=zip --output="V2.2.1-行程助手-源码.zip" HEAD
          unzip -t "V2.2.1-行程助手-源码.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: V2.2.1-行程助手-源码
          path: V2.2.1-行程助手-源码.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CarTripAssistant-V2.2.1-unsigned-IPA
          path: CarTripAssistant-V2.2.1-unsigned.ipa
          if-no-files-found: error
